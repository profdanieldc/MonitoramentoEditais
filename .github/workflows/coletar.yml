name: Coletar editais

on:
  schedule:
    # Horários em UTC. Maranhão é UTC−3, então:
    #   10:00 UTC = 07:00 em São Luís
    #   21:00 UTC = 18:00 em São Luís
    # Duas rodadas por dia: editais como os da SECTI abrem e fecham
    # em poucos dias, e uma janela de 24h é arriscada.
    - cron: "0 10 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:        # permite rodar na mão pelo botão "Run workflow"

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: IP de saída deste runner
        run: curl -s --max-time 15 https://ipinfo.io/ip || echo "(indisponível)"

      - name: Rodar coleta
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python executar.py

      - name: Guardar o acervo
        run: |
          git config user.name "monitor-editais"
          git config user.email "actions@github.com"
          git add docs/editais.json
          if git diff --staged --quiet; then
            echo "Nada mudou nesta rodada."
          else
            git commit -m "Coleta de $(date -u '+%d/%m/%Y %H:%M') UTC"
            git push
          fi
