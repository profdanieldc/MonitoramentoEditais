name: Diagnóstico de rede

# Mapeia a estrutura da página de editais da SECTI para que o parser seja
# escrito em cima do HTML real, e não de suposição. Descartável depois.

on:
  workflow_dispatch:

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Estrutura da página de editais da SECTI
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup
          from collections import Counter

          CAB = {"User-Agent": "monitor-editais/0.1 (projeto pessoal de "
                               "acompanhamento de editais; contato via GitHub)"}
          URL = "https://secti.ma.gov.br/programas-ou-campanhas/editais-2026"

          r = requests.get(URL, headers=CAB, timeout=30)
          r.encoding = r.apparent_encoding or "utf-8"
          print(f"http={r.status_code}  bytes={len(r.content)}\n")
          sopa = BeautifulSoup(r.text, "html.parser")

          for t in sopa(["script", "style"]):
              t.decompose()

          print("== contagem de tags estruturais")
          for tag in ["table", "tr", "ul", "ol", "li", "article",
                      "section", "h1", "h2", "h3", "h4", "p", "a"]:
              n = len(sopa.find_all(tag))
              if n:
                  print(f"   {tag:9} {n}")

          print("\n== classes mais frequentes")
          classes = Counter()
          for el in sopa.find_all(class_=True):
              for c in el.get("class", []):
                  classes[c] += 1
          for nome, n in classes.most_common(25):
              print(f"   {n:4}  .{nome}")

          links = sopa.find_all("a", href=True)
          pdfs = [a for a in links if ".pdf" in a["href"].lower()]
          print(f"\n== links: {len(links)} no total, {len(pdfs)} apontando para PDF")
          print("\n== primeiros 20 links para PDF (texto -> href)")
          for a in pdfs[:20]:
              texto = a.get_text(" ", strip=True)[:95] or "(sem texto)"
              print(f"   {texto}")
              print(f"      {a['href'][:130]}")

          print("\n== ancestrais do primeiro link de PDF (para achar o contêiner)")
          if pdfs:
              atual = pdfs[0]
              for nivel in range(6):
                  atual = atual.parent
                  if atual is None:
                      break
                  cls = ".".join(atual.get("class", [])) or "(sem classe)"
                  ident = atual.get("id") or "(sem id)"
                  print(f"   nivel {nivel+1}: <{atual.name}> classe={cls} id={ident}")

          print("\n== títulos da página")
          for h in sopa.find_all(["h1", "h2", "h3", "h4"])[:25]:
              print(f"   <{h.name}> {h.get_text(' ', strip=True)[:110]}")

          texto = re.sub(r"\s+", " ", sopa.get_text(" ", strip=True))
          print(f"\n== amostra do texto ({len(texto)} caracteres no total)")
          print("  " + texto[:1400])

          print("\n\n== o sitemap serve?")
          try:
              s = requests.get("https://secti.ma.gov.br/xml/sitemap",
                               headers=CAB, timeout=30)
              print(f"   http={s.status_code} tipo={s.headers.get('content-type')} "
                    f"bytes={len(s.content)}")
              print("   " + s.text[:600].replace("\n", "\n   "))
          except Exception as e:
              print(f"   falhou: {type(e).__name__}")
          PY
