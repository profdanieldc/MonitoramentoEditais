name: Diagnóstico de rede

# Segunda rodada. O curl alcança o portal da UFMA sem problema, então o
# que trava é alguma diferença na requisição do Python. Este workflow
# compara variações de cabeçalho para isolar a causa.

on:
  workflow_dispatch:

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Comparar cabeçalhos
        run: |
          python - <<'PY'
          import requests, time

          URL = "https://portalpadrao.ufma.br/dted/colecoes/todos-os-editais"

          NAVEGADOR = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                       "AppleWebKit/537.36 (KHTML, like Gecko) "
                       "Chrome/128.0.0.0 Safari/537.36")

          casos = [
              ("user-agent do coletor",
               {"User-Agent": "monitor-editais/0.1 (projeto pessoal de "
                              "acompanhamento de editais; contato via GitHub)"}),
              ("user-agent de navegador", {"User-Agent": NAVEGADOR}),
              ("user-agent do curl", {"User-Agent": "curl/8.5.0"}),
              ("padrao do requests", None),
              ("navegador + accept completo", {
                  "User-Agent": NAVEGADOR,
                  "Accept": "text/html,application/xhtml+xml,application/xml;"
                            "q=0.9,*/*;q=0.8",
                  "Accept-Language": "pt-BR,pt;q=0.9",
              }),
          ]

          for nome, cabecalho in casos:
              inicio = time.time()
              try:
                  r = requests.get(URL, headers=cabecalho, timeout=25)
                  linhas = r.text.count("<tr")
                  print(f"{nome:32} http={r.status_code} "
                        f"{time.time()-inicio:.1f}s  bytes={len(r.content)} "
                        f"linhas_tabela={linhas}")
              except Exception as erro:
                  print(f"{nome:32} FALHOU em {time.time()-inicio:.1f}s "
                        f"-> {type(erro).__name__}")
              time.sleep(3)
          PY
